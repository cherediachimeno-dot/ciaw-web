name: Keep ES and CA as full mirrors of CIAW English pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "game-studies.html"
      - "research.html"
      - "resources.html"
      - "privacy.html"
      - "locales/translations.json"
      - "scripts/localize_ciaw.py"
      - ".github/workflows/build-full-locales.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ciaw-translation-sync
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate all 10 Spanish and Catalan pages from the English source
        run: python scripts/localize_ciaw.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es.html ca.html game-studies-es.html game-studies-ca.html research-es.html research-ca.html resources-es.html resources-ca.html privacy-es.html privacy-ca.html
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize complete Spanish and Catalan mirrors of CIAW'
            git push
          else
            echo 'Translations already match English source.'
          fi
