name: One-time visual verification of CIAW
on:
  push:
    paths: ['.github/workflows/visual-review-ciaw.yml']
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published content, links and illustrations
        run: |
          python -m pip -q install requests beautifulsoup4 pillow
          python - <<'PY'
          from bs4 import BeautifulSoup
          import requests, io
          from PIL import Image
          base='https://ciaw.es'
          r=requests.get(base+'/?verify=20261017',timeout=35)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          assert 'Research, publishing, exchange.' in r.text
          assert 'Different Minds.' in r.text
          assert 'Arturo Galindo García' in r.text
          assert 'ai-antiquity-vol2-issue2.webp' in r.text
          for path in ('assets/arturo-galindo-neurodiversity.webp','assets/ai-antiquity-vol2-issue2.webp','assets/playing-antiquity-banner.webp'):
            res=requests.get(base+'/'+path,timeout=35)
            res.raise_for_status()
            img=Image.open(io.BytesIO(res.content))
            print('VERIFIED IMAGE',path,img.format,img.size,len(res.content),res.headers.get('Content-Type'))
          ids={el['id'] for el in soup.find_all(id=True)}
          missing=[a.get('href') for a in soup.select('a[href^="#"]') if a.get('href')[1:] not in ids]
          assert not missing,missing
          print('VERIFIED PUBLISHED SITE',r.status_code,'TITLE',soup.title.string, 'IDS',len(ids))
          PY
      - name: Verify rendered layout at desktop and mobile sizes
        run: |
          python -m pip -q install playwright
          mkdir -p .preview-ciaw
          cat > /tmp/render.py <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          from pathlib import Path
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for name,target,width,height in [('highlights','highlights',1400,1000),('journal','journal',1400,1000),('neuro','neurodiversity',1400,1050),('mobile-neuro','neurodiversity',390,850)]:
              page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              page.goto('https://ciaw.es/',wait_until='networkidle',timeout=60000)
              page.add_style_tag(content='html { scroll-behavior: auto !important } * {animation-duration:0s!important;transition-duration:0s!important}')
              page.locator('#'+target).evaluate("(el)=>window.scrollTo({top:el.getBoundingClientRect().top + window.scrollY - 100,behavior:'instant'})")
              page.wait_for_timeout(600)
              png='/tmp/'+name+'.png'
              page.screenshot(path=png)
              jpg=Path('.preview-ciaw')/(name+'.jpg')
              Image.open(png).convert('RGB').save(jpg,quality=73,optimize=True)
              data=page.evaluate("()=>({horizontalOverflow:document.documentElement.scrollWidth-innerWidth, scrollY:window.scrollY, sectionY:document.getElementById('"+target+"').getBoundingClientRect().top})")
              print('SCREENSHOT',name,data,jpg.stat().st_size)
              assert data['horizontalOverflow'] <= 1,name+' overflow'
              if name=='journal':
                assert page.locator('.issue-cover img').evaluate('(img)=>img.complete && img.naturalWidth>0')
              if target=='neurodiversity':
                assert page.locator('.neuro-figure img').evaluate('(img)=>img.complete && img.naturalWidth>0')
              page.close()
            browser.close()
          PY
          python /tmp/render.py
      - name: Save previews for one-time visual check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .preview-ciaw
          git diff --cached --quiet || (git commit -m 'Capture one-time CIAW redesign visual QA screenshots' && git push)
