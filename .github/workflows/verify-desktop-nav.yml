name: Verify desktop navigation fit across CIAW languages
on:
  push:
    paths:
      - ".github/workflows/verify-desktop-nav.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install playwright
      - name: Check real browser nav widths and responsive menu
        run: |
          cat > /tmp/check.py <<'PY'
          from playwright.sync_api import sync_playwright
          root="https://ciaw.es/"
          cases=[(p,w) for p in ['index.html','es.html','ca.html'] for w in (390,1024,1200,1280,1366,1440,1600)]
          cases += [(p,w) for p in ['game-studies-es.html','game-studies-ca.html','research-es.html','resources-ca.html','privacy-es.html'] for w in (1280,1440)]
          errors=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for path,width in cases:
              page=browser.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
              page.goto(root+path,wait_until='domcontentloaded',timeout=55000)
              page.wait_for_timeout(160)
              is_home=path in ['index.html','es.html','ca.html']
              nav='.site-header nav .menu' if is_home else '.ciaw-header-links'
              btn='.site-header .mobile-menu-btn' if is_home else '.ciaw-menu-toggle'
              brand='.site-header .logo' if is_home else '.ciaw-header-brand img'
              data=page.evaluate("""({nav,btn,brand})=>{
                const n=document.querySelector(nav),b=document.querySelector(btn),img=document.querySelector(brand);
                const visible=(el)=>el && getComputedStyle(el).display!=='none';
                const r=(el)=>{const z=el.getBoundingClientRect();return {left:z.left,right:z.right,top:z.top,bottom:z.bottom,width:z.width}};
                const items=[...n.children].filter(visible);
                return {navVisible:visible(n),buttonVisible:visible(b),navBox:r(n),brandBox:r(img),items:items.map(el=>({name:el.innerText.trim().slice(0,30),...r(el)})),overflow:document.documentElement.scrollWidth-innerWidth};
              }""",{"nav":nav,"btn":btn,"brand":brand})
              print('CHECK',path,width,'horizontal',data['navVisible'],'hamburger',data['buttonVisible'],'overflow',data['overflow'],'brandEnd',round(data['brandBox']['right']),'links',len(data['items']))
              if data['overflow']>2:errors.append((path,width,'horizontal overflow',data['overflow']))
              if width>=1200:
                if not data['navVisible'] or data['buttonVisible']:errors.append((path,width,'hamburger shown at desktop'))
                items=data['items']
                if items and data['brandBox']['right']>items[0]['left']-3:
                  errors.append((path,width,'logo overlaps nav',data['brandBox']['right'],items[0]['left']))
                if items and items[-1]['right']>width-4:errors.append((path,width,'rightmost link clipped',items[-1]['right']))
                for a,b in zip(items,items[1:]):
                  if a['right']>b['left']+2:errors.append((path,width,'overlapping labels',a['name'],b['name'],round(a['right']-b['left'])))
              else:
                if data['navVisible'] or not data['buttonVisible']:errors.append((path,width,'expected responsive menu'))
              page.close()
            browser.close()
          if errors:
            print('ERRORS',errors)
            raise AssertionError(str(errors))
          print('PASS',len(cases),'desktop and mobile navigation scenarios')
          PY
          python /tmp/check.py
