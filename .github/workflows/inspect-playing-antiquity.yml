name: Inspect Playing Antiquity artwork
on:
  push:
    paths:
      - '.github/workflows/inspect-playing-antiquity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inventory page artwork
        run: python scripts/inspect_playing_antiquity.py
      - name: Save inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/playing-antiquity-inventory.json
          git diff --cached --quiet || (git commit -m 'Inventory existing Playing Antiquity artwork' && git push)
