name: Identify CIAW Academia profile avatar
on:
  push:
    paths: [".github/workflows/find-academia-icon.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install requests beautifulsoup4 pillow
      - name: Find public profile avatar and store image for visual verification
        run: |
          python - <<'PY'
          import requests,io,json,re
          from PIL import Image
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pathlib import Path
          pages=['https://independent.academia.edu/AIAntiquity','https://ai-antiquity.org/index.php/ai/ciaw']
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'})
          for page in pages:
            try:
              r=session.get(page,timeout=35)
              print('PAGE',page,r.status_code,r.url,len(r.content))
              soup=BeautifulSoup(r.text,'html.parser')
              options=[]
              for m in soup.find_all('meta'):
                if m.get('property') in ('og:image','og:image:secure_url','twitter:image') or m.get('name')=='twitter:image':
                  options.append((m.get('property') or m.get('name'),m.get('content')))
              for img in soup.find_all('img')[:45]:
                info=(img.get('alt'),img.get('src'),img.get('data-src'),img.get('srcset'),img.get('class'))
                print('IMG',str(info)[:650])
                for key in ('src','data-src'):
                  if img.get(key):
                    options.append((str(img.get('alt'))[:75] or 'image',urljoin(page,img.get(key))))
              for key,url in options:
                if not url:continue
                if not any(t in (key+' '+url).lower() for t in ['profile','avatar','ciaw','logo','image','header','og:image']): continue
                try:
                  ir=session.get(url,timeout=15)
                  im=Image.open(io.BytesIO(ir.content))
                  print('CANDIDATE',str(key)[:70],url[:240],'SIZE',im.size,'FMT',im.format)
                  if im.width>=100 and im.height>=100 and .60 < im.width/im.height < 1.5:
                    n=len(list(Path('assets').glob('academia-icon-candidate-*')))+1
                    suffix='jpg' if im.format=='JPEG' else 'png'
                    path=Path('assets')/f'academia-icon-candidate-{n}.{suffix}'
                    im.convert('RGB' if suffix=='jpg' else 'RGBA').save(path)
                    print('SAVED',path)
                except Exception as e:print('ERROR',str(key)[:30],str(e)[:160])
            except Exception as e:print('PAGE_ERROR',page,str(e)[:300])
          PY
      - name: Commit avatar candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/academia-icon-candidate-* || true
          git diff --cached --quiet || (git commit -m "Inspect public CIAW profile avatar imagery" && git push)
