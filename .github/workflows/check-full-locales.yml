name: One-time full multilingual CIAW visual QA
on:
  push:
    paths: [".github/workflows/check-full-locales.yml"]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python -m pip -q install requests beautifulsoup4 pillow playwright
      - name: Test all 15 pages, local links and structural parity
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import requests
          s=requests.Session()
          root='https://ciaw.es/'
          en=['index.html','game-studies.html','research.html','resources.html','privacy.html']
          loc=[('es', 'es.html'),('ca','ca.html')]
          allpages=en+[('game-studies-' + lng + '.html') for lng in ['es','ca']]+[x+'-'+lng+'.html' for x in ['research','resources','privacy'] for lng in ['es','ca']]+['es.html','ca.html']
          for page in allpages:
            res=s.get(root+page,timeout=35)
            res.raise_for_status()
            dom=BeautifulSoup(res.text,'html.parser')
            imgs=[x['src'] for x in dom.select('img[src]')]
            links=[a['href'] for a in dom.select('a[href]') if not a['href'].startswith(('http://','https://','mailto:','#'))]
            for src in set(imgs+links):
              uri=src.split('#')[0]
              if not uri:continue
              r=s.get(root+uri,timeout=25)
              if r.status_code!=200:raise AssertionError((page,'broken',src,r.status_code))
            print('PAGE',page,dom.html['lang'],len(res.text),'sections',len(dom.select('section')),'images',len(imgs),'links',len(links))
          for enname in en:
            original=BeautifulSoup(s.get(root+enname).text,'html.parser')
            for lng in ('es','ca'):
              target=(lng+'.html' if enname=='index.html' else enname.replace('.html','-'+lng+'.html'))
              translated=BeautifulSoup(s.get(root+target).text,'html.parser')
              for selector in ('section','img','article','details','h2','h3'):
                assert len(original.select(selector))==len(translated.select(selector)),(enname,target,selector)
              if enname=='index.html':
                assert [x['id'] for x in original.select('section[id]')]==[x['id'] for x in translated.select('section[id]')]
                assert 'Center for Innovation in Ancient Worlds' in translated.get_text(' ',strip=True)
              print('PARITY',enname,target,'OK')
          PY
      - name: Desktop and mobile screenshots and nav checks
        run: |
          mkdir -p .locale-review
          cat > /tmp/qa_visual.py <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          pages=['index.html','es.html','ca.html','game-studies-es.html','game-studies-ca.html']
          checks=[('desktop-'+p,p,1440,1000) for p in pages[:3]]+[('mobile-'+p,p,390,850) for p in pages]+[('desktop-events-es','es.html#events',1440,950),('mobile-game-es','game-studies-es.html',390,850)]
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for tag,path,width,height in checks:
              pg=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              pg.goto('https://ciaw.es/'+path,wait_until='domcontentloaded',timeout=50000)
              pg.add_style_tag(content='html{scroll-behavior:auto!important}*{animation-duration:0s!important;transition-duration:0s!important}')
              if '#events' in path:
                pg.locator('#events').evaluate('(el)=>window.scrollTo(0,el.getBoundingClientRect().top+window.scrollY-125)')
              pg.wait_for_timeout(650)
              w=pg.evaluate('()=>document.documentElement.scrollWidth-innerWidth')
              print('VIEW',tag,'overflow',w,'heading',pg.locator('h1').first.inner_text()[:100])
              assert w<=2,tag+' horizontal overflow'
              if path in ('index.html','es.html','ca.html') and width==1440:
                menu=pg.locator('.site-header nav .menu')
                btn=pg.locator('#mobile-menu-btn')
                assert menu.evaluate('(x)=>getComputedStyle(x).display')=='none',(tag,'translated nav would clip at desktop width')
                assert btn.evaluate('(x)=>getComputedStyle(x).display')!='none',(tag,'hamburger not accessible at 1440px')
              if path in ('es.html','ca.html') and width==390:
                btn=pg.locator('#mobile-menu-btn')
                btn.click()
                assert btn.get_attribute('aria-expanded')=='true'
                btn.click()
              if 'game-studies-' in path and width==390:
                btn=pg.locator('#ciaw-menu-toggle')
                btn.click()
                assert btn.get_attribute('aria-expanded')=='true'
                btn.click()
              image='/tmp/locale-'+tag.replace('/','-').replace('.','-')+'.png'
              pg.screenshot(path=image)
              Image.open(image).convert('RGB').save('.locale-review/'+tag.replace('.','-')+'.jpg',quality=73,optimize=True)
              pg.close()
            browser.close()
          PY
          python /tmp/qa_visual.py
      - name: Save QA captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .locale-review
          git diff --cached --quiet || (git commit -m 'Capture temporary visual QA for full bilingual CIAW mirrors' && git push)
