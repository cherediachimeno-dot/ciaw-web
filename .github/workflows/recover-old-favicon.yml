name: Restore authentic CIAW favicon
on:
  push:
    paths:
      - ".github/workflows/recover-old-favicon.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image inspection
        run: python -m pip -q install pillow
      - name: Restore original icon without altering binary
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from hashlib import sha256
          import shutil
          source=Path('assets/legacy-favicon.ico')
          assert source.exists()
          original=source.read_bytes()
          im=Image.open(source)
          print('ORIGINAL_ICON_SIZES',sorted(im.info.get('sizes',[])))
          print('ORIGINAL_ICON_SHA256',sha256(original).hexdigest())
          shutil.copyfile(source,'favicon.ico')
          assert Path('favicon.ico').read_bytes()==original
          preview=Image.open(source)
          if (256,256) in preview.info.get('sizes',[]):
            preview.size=(256,256)
          preview.convert('RGBA').resize((256,256),Image.Resampling.NEAREST).save('assets/legacy-favicon-preview.png')
          PY
      - name: Commit original favicon to webroot and temporary preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon.ico assets/legacy-favicon-preview.png
          git diff --cached --quiet || (git commit -m 'Restore exact original favicon.ico from legacy CIAW Netlify website' && git push)
