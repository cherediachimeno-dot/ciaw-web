name: Copiar web pública de CIAW
on:
  push:
    paths:
      - '.github/workflows/copiar-ciaw.yml'
      - 'scripts/mirror_ciaw.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install 'requests>=2,<3' 'beautifulsoup4>=4,<5'
      - name: Descargar contenido público
        run: python scripts/mirror_ciaw.py
      - name: Guardar archivos recuperados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'Guardar copia pública de ciaw.es' && git push)
