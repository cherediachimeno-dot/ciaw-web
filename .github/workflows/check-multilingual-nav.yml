name: Check unified CIAW menus
on:
  push:
    paths: [".github/workflows/check-multilingual-nav.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image tools
        run: python -m pip -q install playwright pillow requests
      - name: Verify published headers at desktop and mobile widths
        run: |
          mkdir -p .review-ciaw
          cat > /tmp/inspect_nav.py <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          from pathlib import Path
          import time
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path='/usr/bin/google-chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for lang in ('en','es','ca'):
              for width in (1750,390):
                page=browser.new_page(viewport={'width':width,'height':820},device_scale_factor=1)
                url='https://ciaw.es/'+('index.html' if lang=='en' else lang+'.html')
                page.goto(url,wait_until='domcontentloaded',timeout=60000)
                selector='.site-header' if lang=='en' else '.ciaw-shared-header'
                logoSel='.site-header .logo' if lang=='en' else '.ciaw-header-brand img'
                page.wait_for_selector(selector,timeout=25000)
                logo=page.locator(logoSel)
                dims=logo.evaluate('(el)=>({width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height,naturalWidth:el.naturalWidth})')
                overflow=page.evaluate('()=>document.documentElement.scrollWidth-window.innerWidth')
                print('PAGE',lang,width,'logo',dims,'overflow',overflow,'title',page.title())
                assert dims['naturalWidth']>500,(lang,'logo did not load')
                assert 180<=dims['width']<=260,(lang,'logo wrong size',dims)
                assert overflow<=2,(lang,'horizontal overflow',overflow)
                if lang in ('es','ca'):
                  assert page.locator('h1').inner_text()=='Center for Innovation in Ancient Worlds'
                  desktop=page.locator('.ciaw-header-links')
                  visible=desktop.evaluate('(el)=>getComputedStyle(el).display')
                  print('MENU',lang,width,'desktop',visible)
                  if width==1750:assert visible=='flex'
                  else:
                    assert visible=='none'
                    button=page.locator('#ciaw-menu-toggle')
                    button.click()
                    assert button.get_attribute('aria-expanded')=='true'
                    assert page.locator('#ciaw-mobile-menu').evaluate('(el)=>getComputedStyle(el).display')=='flex'
                    button.click()
                    assert button.get_attribute('aria-expanded')=='false'
                page.wait_for_timeout(400)
                target=Path('.review-ciaw')/f'{lang}-{width}.jpg'
                png=f'/tmp/{lang}-{width}.png'
                page.screenshot(path=png)
                Image.open(png).convert('RGB').save(target,quality=69,optimize=True)
                page.close()
            browser.close()
          PY
          python /tmp/inspect_nav.py
      - name: Commit temporary inspection captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .review-ciaw
          git diff --cached --quiet || (git commit -m 'Capture temporary review of multilingual CIAW header layouts' && git push)
