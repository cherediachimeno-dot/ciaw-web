name: Import official Neurodiversity issue artwork
on:
  push:
    paths:
      - '.github/workflows/import-neuro-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import original illustration and issue cover
        run: |
          python -m pip -q install requests Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import requests, io
          base=Path('assets')
          base.mkdir(exist_ok=True)
          sources=[
           ('https://i.ibb.co/BR8ygJZ/ilustration.webp','arturo-galindo-neurodiversity.webp',None),
           ('https://ai-antiquity.org/public/journals/1/cover_issue_4_en.jpg','ai-antiquity-vol2-issue2.webp',1500)
          ]
          for url,filename,maxwidth in sources:
            r=requests.get(url,timeout=35,headers={'User-Agent':'Mozilla/5.0 academic website migration'})
            r.raise_for_status()
            pic=Image.open(io.BytesIO(r.content))
            print(filename,'FROM',url,'ORIGINAL',pic.format,pic.size)
            assert pic.width>400 and pic.height>600
            if maxwidth:
              pic.thumbnail((maxwidth,3000),Image.Resampling.LANCZOS)
              pic.convert('RGB').save(base/filename,'WEBP',quality=86,method=6)
            else:
              (base/filename).write_bytes(r.content)
            im=Image.open(base/filename)
            print(filename,'SAVED',im.format,im.size,'BYTES',(base/filename).stat().st_size)
          PY
      - name: Commit images to CIAW repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/arturo-galindo-neurodiversity.webp assets/ai-antiquity-vol2-issue2.webp
          git diff --cached --quiet || (git commit -m 'Import official Arturo Galindo illustration and AI Antiquity 2.2 cover' && git push)
