name: Inspect public Academia logo in browser
on:
  push:
    paths: [".github/workflows/screenshot-academia-profile.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install playwright pillow requests
      - name: Inspect Academy public profile screenshot and link metadata
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from PIL import Image
          import requests
          with sync_playwright() as p:
            b=p.chromium.launch(executable_path='/usr/bin/google-chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            page=b.new_page(viewport={'width':1350,'height':900},device_scale_factor=1)
            try:
              resp=page.goto('https://independent.academia.edu/AIAntiquity',wait_until='domcontentloaded',timeout=30000)
              print('STATUS',resp.status if resp else None,'TITLE',page.title(),'URL',page.url)
              page.wait_for_timeout(4000)
              print('TEXT',page.locator('body').inner_text()[:450])
              print('IMAGES',page.locator('img').count())
              print('IMG_SOURCES',page.locator('img').evaluate_all('(els)=>els.slice(0,25).map(el=>({src:el.currentSrc,alt:el.alt,width:el.naturalWidth,height:el.naturalHeight}))'))
              if resp and resp.status==200 and 'center for innovation' in page.locator('body').inner_text().lower():
                page.screenshot(path='assets/academia-profile-public-screenshot.png')
                print('SAVED SCREENSHOT')
            except Exception as e:print('BROWSER ERROR',str(e)[:370])
            b.close()
          try:
            api=requests.get('https://api.microlink.io/',params={'url':'https://independent.academia.edu/AIAntiquity'},timeout=25)
            print('MICROLINK',api.status_code,api.text[:4000])
          except Exception as e:print('MICROLINK ERROR',str(e)[:250])
          PY
      - name: Save public screenshot if available
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/academia-profile-public-screenshot.png || true
          git diff --cached --quiet || (git commit -m 'Inspect verified Academia public profile screenshot' && git push)
