name: Publicar CIAW en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "research.html"
      - "game-studies.html"
      - "game-studies.css"
      - "seminar-2026.html"
      - "resources.html"
      - "es.html"
      - "ca.html"
      - "game-studies-es.html"
      - "game-studies-ca.html"
      - "research-es.html"
      - "research-ca.html"
      - "resources-es.html"
      - "resources-ca.html"
      - "privacy-es.html"
      - "privacy-ca.html"
      - "subpages.css"
      - "scripts/localize_ciaw.py"
      - "locales/translations.json"
      - "favicon.ico"
      - "favicon-32.png"
      - "apple-touch-icon.png"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/**"
      - "files/**"
      - "logo.png"
      - "banner.png"
      - "1000002037_cleaned.webp"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4
      - name: Sincronizar todas las páginas en español y catalán
        run: python scripts/localize_ciaw.py
      - name: Preparar archivos estáticos
        run: |
          mkdir -p _site
          cp index.html es.html ca.html privacy.html privacy-es.html privacy-ca.html research.html research-es.html research-ca.html game-studies.html game-studies-es.html game-studies-ca.html game-studies.css seminar-2026.html resources.html resources-es.html resources-ca.html subpages.css favicon.ico favicon-32.png apple-touch-icon.png robots.txt sitemap.xml logo.png banner.png _site/
          cp 1000002037_cleaned.webp _site/
          cp -R assets files _site/
          touch _site/.nojekyll
          test -f _site/assets/playing-antiquity-banner.webp
          test -f _site/files/info1.webp
          test -f _site/files/info2.webp
          test -f _site/files/info3.webp
          test -f _site/favicon.ico
          test -f _site/favicon-32.png
          test -f _site/apple-touch-icon.png
          test -f _site/privacy.html
          test -f _site/sitemap.xml
          test -f _site/research.html
          test -f _site/game-studies.html
          test -f _site/game-studies.css
          test -f _site/seminar-2026.html
          test -f _site/resources.html
          test -f _site/es.html
          test -f _site/ca.html
          for lang in es ca; do
            test -f "_site/game-studies-$lang.html"
            test -f "_site/research-$lang.html"
            test -f "_site/resources-$lang.html"
            test -f "_site/privacy-$lang.html"
          done
          test -f _site/assets/ciaw-social.png
          test -f _site/1000002037_cleaned.webp
      - name: Comprobar configuración de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages-status.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "GitHub Pages API: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Pages no está habilitado en este repositorio. En Settings > Pages, elige GitHub Actions como fuente."
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open('/tmp/pages-status.json'))
          print("Pages URL:",data.get('html_url'))
          print("Build type:",data.get('build_type'))
          print("Status:",data.get('status'))
          if data.get('build_type') not in ('workflow',):
              raise SystemExit("La fuente de Pages no es GitHub Actions. Cambiar Source en Settings > Pages.")
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
