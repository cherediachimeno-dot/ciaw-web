name: Inspect official Neurodiversity artwork
on:
  push:
    paths:
      - '.github/workflows/inspect-neuro-artwork.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect images in official AI and Antiquity pages
        run: |
          python -m pip -q install requests beautifulsoup4 pillow
          cat > /tmp/inspect_images.py <<'PY'
          import requests, urllib.parse, io, re
          from bs4 import BeautifulSoup
          from PIL import Image
          urls=[
            'https://ai-antiquity.org/index.php/ai/issue/view/volume2issue2',
            'https://ai-antiquity.org/index.php/ai/neurodiversity',
            'https://ai-antiquity.org/index.php/ai'
          ]
          session=requests.Session()
          session.headers['User-Agent']='Mozilla/5.0 CIAW academic website migration'
          for url in urls:
            print('\n===== PAGE',url)
            try:
              response=session.get(url,timeout=40)
              print('STATUS',response.status_code,'FINAL',response.url,'LENGTH',len(response.content))
              soup=BeautifulSoup(response.text,'html.parser')
              for m in soup.find_all('meta'):
                if any(k in str(m).lower() for k in ['og:image','twitter:image']):
                  print('META',str(m)[:350])
              for im in soup.find_all('img'):
                src=im.get('src') or im.get('data-src') or ''
                full=urllib.parse.urljoin(response.url,src)
                context=im.parent.get_text(' ',strip=True)[:180]
                dims=''
                if src:
                  try:
                    ir=session.get(full,timeout=25)
                    img=Image.open(io.BytesIO(ir.content))
                    dims=f'{img.format} {img.width}x{img.height} {len(ir.content)} bytes'
                  except Exception as err:
                    dims=str(err)[:80]
                print('IMG',repr(full),'ALT',repr(im.get('alt')),'TITLE',repr(im.get('title')),'DIMENSIONS',dims,'CONTEXT',repr(context))
              for el in soup.find_all(['a','figure']):
                text=el.get_text(' ',strip=True)
                if 'Arturo' in text or 'Galindo' in text:
                  print('ARTURO',str(el)[:900])
            except Exception as exc:
              print('FAILED',repr(exc))
          PY
          python /tmp/inspect_images.py
